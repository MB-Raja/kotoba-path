<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b8452f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kotoba Path">

<title>Kotoba Path — N2 & Work Japanese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ee;--card:#fffdf9;--ink:#1f1c18;--muted:#7b7368;--line:#e6dfd3;--accent:#b8452f;--accent2:#2f6b5e;--soft:#f1ebe1;--good:#2f7d4f;--hard:#b7791f;--again:#b8452f;--easy:#2b6cb0}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--card:#211e1b;--ink:#efe9df;--muted:#a59c90;--line:#35302a;--soft:#2a2622;--accent:#e0705a;--accent2:#5fb3a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.brand{font-family:"Noto Serif JP",serif;font-weight:700;font-size:20px}
.brand span{color:var(--accent)}
.pill{font-size:12px;color:var(--muted);background:var(--soft);padding:4px 10px;border-radius:99px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat small{color:var(--muted);font-size:12px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-weight:500;cursor:pointer;width:100%;text-align:left;display:flex;align-items:center;gap:12px}
.btn:active{transform:scale(.99)}
.btn .ic{font-size:22px;width:30px;text-align:center}
.btn .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary .sub{color:#ffe6df}
.menu{display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.back{background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;padding:4px 0;margin-bottom:8px}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative}
.big{font-family:"Noto Serif JP",serif;font-size:44px;font-weight:700;line-height:1.2;word-break:keep-all}
.big.en{font-family:"Noto Sans JP";font-size:24px;font-weight:500}
.rd{font-size:20px;color:var(--accent2);margin-top:8px}
.mn{font-size:17px;margin-top:6px}
.meta{position:absolute;top:10px;left:12px;font-size:11px;color:var(--muted)}
.speak{position:absolute;top:6px;right:8px;background:none;border:none;font-size:20px;cursor:pointer}
.hint{color:var(--muted);font-size:13px;margin-top:14px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grades button{border:none;border-radius:12px;padding:12px 4px;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.grades small{display:block;font-weight:400;font-size:11px;opacity:.85}
.g0{background:var(--again)}.g1{background:var(--hard)}.g2{background:var(--good)}.g3{background:var(--easy)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.three button{border:none;border-radius:12px;padding:14px 4px;font:inherit;font-weight:700;cursor:pointer;color:#fff}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent2)}
.story p{margin:0 0 12px;font-size:18px;line-height:2}
.story .en{font-size:14px;color:var(--muted);line-height:1.5;margin-top:-8px}
.spk{font-size:12px;color:var(--accent);font-weight:700;display:block}
ruby rt{font-size:10px;color:var(--muted)}
.nofuri rt{visibility:hidden}
.noen .en{display:none}
mark{background:#f6dcc9;color:inherit;border-radius:4px;padding:0 2px}
@media (prefers-color-scheme:dark){mark{background:#5a3a2c}}
textarea,input[type=text],input[type=search]{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
.k{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif JP",serif;font-size:22px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:var(--card)}
.k.l1{background:#f3e1c7}.k.l2{background:#cfe6d6}.k.l3{background:#5c9e7c;color:#fff;border-color:#5c9e7c}
@media (prefers-color-scheme:dark){.k.l1{background:#4a3b25}.k.l2{background:#2c4a3a}.k.l3{background:#3f8a66}}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--sw)}
.wl{list-style:none;padding:0;margin:0}
.wl li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.wl .w{font-family:"Noto Serif JP",serif;font-size:18px}
.wl .r{color:var(--accent2);font-size:13px}
.wl .m{color:var(--muted);font-size:13px;text-align:right}
.tag{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--muted);margin-left:4px}
.loading{color:var(--muted);text-align:center;padding:30px 0}
.dots::after{content:"…";animation:d 1.2s infinite}
@keyframes d{0%{content:"."}33%{content:".."}66%{content:"..."}}
.err{color:var(--accent)}
.fb{white-space:pre-wrap;font-size:15px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
label.set{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
select{font:inherit;border-radius:8px;padding:4px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
</style>
</head>

// W[i] = [display, word, reading, meaning, level, inN2list]
const LV = ['N5','N4','N3','N2','N1',''];
const DAY = 86400000;
const today = () => { const d=new Date(); d.setHours(4,0,0,0); if(new Date().getHours()<4) d.setDate(d.getDate()-1); return d.getTime(); };
let S = { p:{}, known:{}, settings:{newPerDay:10, dir:'jp', focus:'n2first'}, log:{}, streak:{last:0,n:0}, introduced:{} };
// p[i] = {iv,due,ef,reps,lapses}
let db=null, uid=null, saveT=null, sampleFn=null;
const LS='kotoba-path-v1';
function loadLocal(){ try{ const j=localStorage.getItem(LS); if(j) S=Object.assign(S,JSON.parse(j)); }catch(e){} }
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{ if(db&&uid){ try{ await db.collection('data/users/'+uid).doc('progress').set({json:JSON.stringify(S),at:Date.now()}); }catch(e){} } },1500);
}
async function initCaps(){
  try{
    const [d,u] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(d && u){ uid = await u.id(); db=d;
      try{ const snap = await db.collection('data/users/'+uid).doc('progress').get();
        const data = snap && (snap.data ? snap.data() : snap);
        if(data && data.json){ const remote=JSON.parse(data.json); S=Object.assign(S,remote); try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} render(); }
      }catch(e){}
    }
  }catch(e){}
  try{ sampleFn = await claude.use('sample'); if(sampleFn) render(); }catch(e){}
}
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1600); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let playing=false, playId=0;
function stopSpeak(){ playing=false; playId++; try{ speechSynthesis.cancel(); }catch(e){} if(ctx) ctx.cur=-1; }
function speak(t){ stopSpeak(); try{ const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.9; speechSynthesis.speak(u);}catch(e){} }
function toggleStory(){
  if(playing){ stopSpeak(); render(); return; }
  stopSpeak(); playing=true; const id=playId; const lines=ctx.data.lines;
  const next=k=>{ if(!playing||id!==playId) return;
    if(k>=lines.length){ playing=false; ctx.cur=-1; render(); return; }
    ctx.cur=k; render();
    try{ const u=new SpeechSynthesisUtterance(lines[k].kana||lines[k].jp.replace(/\{[^}]*\}|\[\[|\]\]/g,'')); u.lang='ja-JP'; u.rate=.9;
      u.onend=()=>setTimeout(()=>next(k+1),250); u.onerror=()=>{ if(id===playId){playing=false;ctx.cur=-1;render();} };
      speechSynthesis.speak(u);
    }catch(e){ playing=false; ctx.cur=-1; render(); } };
  next(0);
}
const isK = c => c>='一' && c<='鿿';

// ---------- scheduling ----------
function isDue(i){ const p=S.p[i]; return p && !S.known[i] && p.due<=Date.now(); }
function dueList(){ return Object.keys(S.p).map(Number).filter(isDue).sort((a,b)=>S.p[a].due-S.p[b].due); }
function newOrder(){
  const out=[]; const rank=i=>{ const w=W[i]; const l=LV.indexOf(w[4]);
    if(S.settings.focus==='n2first') return (w[5]?0:10)+ (l<0?9:l);
    if(S.settings.focus==='easyfirst') return l<0?9:l;
    return 0; };
  for(let i=0;i<W.length;i++) if(!S.p[i] && !S.known[i]) out.push(i);
  return out.sort((a,b)=>rank(a)-rank(b)||a-b);
}
function newLeftToday(){ const t=today(); return Math.max(0, S.settings.newPerDay - (S.introduced[t]||0)); }
function grade(i,g){
  const now=Date.now(); let p=S.p[i];
  if(!p){ p=S.p[i]={iv:0,due:now,ef:2.5,reps:0,lapses:0}; const t=today(); S.introduced[t]=(S.introduced[t]||0)+1; }
  if(g===0){ p.reps=0; p.lapses++; p.iv=0; p.ef=Math.max(1.3,p.ef-.2); p.due=now+10*60000; }
  else{
    if(p.reps===0) p.iv = g===1?1: g===2?1:4;
    else if(p.reps===1) p.iv = g===1?3: g===2?4:7;
    else p.iv = Math.round(p.iv * (g===1?1.2: g===2?p.ef: p.ef*1.3));
    p.ef = Math.max(1.3, p.ef + (g===1?-.15: g===3?.15:0));
    p.reps++; p.due = today()+p.iv*DAY;
  }
  const t=today(); S.log[t]=(S.log[t]||0)+1;
  if(S.streak.last!==t){ S.streak.n = (S.streak.last===t-DAY)? S.streak.n+1 : 1; S.streak.last=t; }
  save();
}
function strength(i){ if(S.known[i]) return 3; const p=S.p[i]; if(!p) return 0; if(p.iv>=21) return 3; if(p.iv>=4) return 2; return 1; }

let view='home', ctx={};
function go(v,c){ stopSpeak(); view=v; ctx=c||{}; window.scrollTo(0,0); render(); }
function render(){
  const app=document.getElementById('app');
  const f={home,check,study,story,kanji,browse,settings}[view]||home;
  app.innerHTML = f();
  if(view==='story' && ctx.pending){ ctx.pending=false; runStory(); }
}

// level check
function check(){
  if(!ctx.lvl) return `<button class="back" onclick="go('home')">← Home</button>
  <div class="card"><h2>LEVEL CHECK</h2><p style="margin-top:0">You'll see words one by one. Tap fast — don't think too long.<br><b>Know it</b> = skipped forever (you can undo in Word list). <b>Unsure</b> / <b>No</b> = goes into study.</p>
  <div class="menu">${['N5','N4','N3','N2'].map(l=>{const left=W.reduce((a,w,i)=>a+(w[4]===l&&!S.known[i]&&!S.p[i]&&!(ctx.seen||{})[i]?1:0),0);return `<button class="btn" onclick="startCheck('${l}')"><span class="ic">${l}</span><span>${l} words<span class="sub">${left} not checked yet</span></span></button>`}).join('')}</div></div>`;
  const i=ctx.q[ctx.k];
  if(i===undefined) return `<button class="back" onclick="go('home')">← Home</button><div class="card" style="text-align:center"><h2>DONE</h2><p>Marked <b>${ctx.knew}</b> as known out of ${ctx.q.length}.</p><button class="btn primary" onclick="startCheck('${ctx.lvl}')"><span class="ic">⚡</span><span>Next 30 ${ctx.lvl} words</span></button><div style="height:8px"></div><button class="btn" onclick="go('home')"><span class="ic">🏠</span><span>Home</span></button></div>`;
  const w=W[i];
  return `<button class="back" onclick="go('home')">← Home</button>
  <div class="row" style="justify-content:space-between"><span class="pill">${ctx.lvl} · ${ctx.k+1}/${ctx.q.length}</span><span class="pill">known: ${ctx.knew}</span></div>
  <div class="bar"><i style="width:${ctx.k/ctx.q.length*100}%"></i></div>
  <div class="card flash" onclick="ctx.show=1;render()"><div class="big">${esc(w[0])}</div>${ctx.show?`<div class="rd">${esc(w[2])}</div><div class="mn">${esc(w[3])}</div>`:'<div class="hint">Tap to peek at the answer</div>'}</div>
  <div class="three"><button style="background:var(--again)" onclick="ck(0)">No</button><button style="background:var(--hard)" onclick="ck(1)">Unsure</button><button style="background:var(--good)" onclick="ck(2)">Know it</button></div>`;
}
function startCheck(l){
  const pool=[]; for(let i=0;i<W.length;i++) if(W[i][4]===l && !S.known[i] && !S.p[i]) pool.push(i);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  go('check',{lvl:l,q:pool.slice(0,30),k:0,knew:0});
}
function ck(g){ const i=ctx.q[ctx.k];
  if(g===2){ S.known[i]=1; ctx.knew++; }
  else { S.p[i]={iv:0,due:Date.now(),ef:g===1?2.5:2.3,reps:0,lapses:0}; }
  save(); ctx.k++; ctx.show=0; render(); }

// study
function startStudy(){
  const due=dueList(); const nw=newOrder().slice(0,newLeftToday());
  const q=[...due.slice(0,150), ...nw];
  if(!q.length){ toast('All done for today 🎉'); return; }
  go('study',{q,k:0,show:0,newSet:new Set(nw),again:[]});
}
function study(){
  let i=ctx.q[ctx.k];
  if(i===undefined && ctx.again.length){ ctx.q=ctx.q.concat(ctx.again); ctx.again=[]; i=ctx.q[ctx.k]; }
  if(i===undefined) return `<button class="back" onclick="go('home')">← Home</button><div class="card" style="text-align:center"><h2>SESSION COMPLETE</h2><p style="font-size:40px;margin:6px 0">🎉</p><p>${S.log[today()]||0} cards today. Now read them in context:</p><button class="btn primary" onclick="go('story',{mode:'story',pending:true})"><span class="ic">📖</span><span>Today's story</span></button><div style="height:8px"></div><button class="btn" onclick="go('story',{mode:'work',pending:true})"><span class="ic">💼</span><span>Work Japanese scene</span></button><div style="height:8px"></div><button class="btn" onclick="go('home')"><span class="ic">🏠</span><span>Home</span></button></div>`;
  const w=W[i]; const isNew=!S.p[i]||S.p[i].reps===0;
  const rev = S.settings.dir==='en' || (S.settings.dir==='mix' && (i+ctx.k)%2===1);
  const front = rev ? `<div class="big en">${esc(w[3])}</div>` : `<div class="big">${esc(w[0])}</div>`;
  const back = rev ? `<div class="big" style="margin-top:10px">${esc(w[0])}</div><div class="rd">${esc(w[2])}</div>` : `<div class="rd">${esc(w[2])}</div><div class="mn">${esc(w[3])}</div>`;
  const alt = w[0]!==w[1] ? `<div class="hint">also written ${esc(w[1])}</div>` : (w[1]!==w[2] && rev ? '' : '');
  const kj=[...w[1]].filter(isK);
  const p=S.p[i]||{reps:0,iv:0,ef:2.5};
  const iv=g=>{ if(g===0) return '10m'; let v; if(p.reps===0) v=g===1?1:g===2?1:4; else if(p.reps===1) v=g===1?3:g===2?4:7; else v=Math.round(p.iv*(g===1?1.2:g===2?p.ef:p.ef*1.3)); return v>=30?Math.round(v/30)+'mo':v+'d'; };
  return `<button class="back" onclick="go('home')">← Home</button>
  <div class="row" style="justify-content:space-between"><span class="pill">${ctx.k+1} / ${ctx.q.length}</span><span class="pill">${isNew?'NEW':'review'} · ${w[4]||'—'}${w[5]?' · N2 core':''}</span></div>
  <div class="bar"><i style="width:${ctx.k/ctx.q.length*100}%"></i></div>
  <div class="card flash" onclick="if(!ctx.show){ctx.show=1;render()}">
    <span class="meta">${rev?'Say it in Japanese':'Meaning + reading?'}</span>
    <button class="speak" onclick="event.stopPropagation();speak('${esc(w[2])}')">🔊</button>
    ${front}${ctx.show?back+alt+(kj.length?`<div class="row" style="justify-content:center;margin-top:12px">${kj.map(c=>`<button class="chip" onclick="event.stopPropagation();go('kanji',{sel:'${c}',from:'study',save:ctx})">${c} →</button>`).join('')}</div>`:''):'<div class="hint">Try to recall, then tap</div>'}
  </div>
  ${ctx.show?`<div class="grades"><button class="g0" onclick="gr(0)">Again<small>${iv(0)}</small></button><button class="g1" onclick="gr(1)">Hard<small>${iv(1)}</small></button><button class="g2" onclick="gr(2)">Good<small>${iv(2)}</small></button><button class="g3" onclick="gr(3)">Easy<small>${iv(3)}</small></button></div>
  <div style="text-align:center;margin-top:10px"><button class="chip" onclick="markKnown(${i})">I already know this — skip forever</button></div>`:''}`;
}
function gr(g){ const i=ctx.q[ctx.k]; grade(i,g); if(g===0) ctx.again.push(i); ctx.k++; ctx.show=0; render(); }
function markKnown(i){ S.known[i]=1; delete S.p[i]; save(); ctx.k++; ctx.show=0; render(); toast('Marked as known'); }

// story / work
const SCENES=['a client meeting about a delayed release','a schedule change with a Japanese client (日程調整)','reporting a bug to the client and apologising','asking a teammate in India to fix something before the deadline','a polite email declining an extra request','explaining a requirement change in a 定例会議','an estimate (見積もり) discussion','a phone call with the client\'s 担当者 about test results'];
function todaysWords(){
  const t=today();
  const studied=Object.keys(S.p).map(Number).filter(i=>S.p[i].reps>0 && (S.p[i].lapses>0 || S.p[i].iv<=7));
  let pick=studied.sort((a,b)=>(S.p[b].lapses-S.p[a].lapses)||(S.p[a].iv-S.p[b].iv)).slice(0,8);
  if(pick.length<6) pick=pick.concat(dueList().filter(i=>!pick.includes(i)).slice(0,8-pick.length));
  if(pick.length<6) pick=pick.concat(newOrder().slice(0,8-pick.length));
  return pick;
}
function story(){
  const title = ctx.mode==='work'?'WORK JAPANESE':'TODAY\'S STORY';
  if(!sampleFn) return `<button class="back" onclick="go('home')">← Home</button><div class="card"><h2>${title}</h2>${typeof claude==='undefined'?`<p>Stories and reply checking are written by Claude, so they only work in the claude.ai version of this app.</p><a class="btn" href="https://claude.ai/artifact/4M8nuYSbsYykQFFR5zHcYu" target="_blank" rel="noopener"><span class="ic">↗</span><span>Open the claude.ai version</span></a>`:`<p>Stories are written by Claude. Open this page on claude.ai in a web browser (signed in) and allow the "ask Claude" permission when prompted.</p><button class="btn" onclick="go('story',{mode:'${ctx.mode}',pending:true})"><span class="ic">↻</span><span>Try again</span></button>`}</div>`;
  let h=`<button class="back" onclick="go('home')">← Home</button>`;
  if(ctx.loading) return h+`<div class="card"><h2>${title}</h2><div class="loading">Writing with your words<span class="dots"></span></div></div>`;
  if(ctx.error) return h+`<div class="card"><h2>${title}</h2><p class="err">${esc(ctx.error)}</p><button class="btn" onclick="ctx.pending=true;ctx.error=null;render()"><span class="ic">↻</span><span>Try again</span></button></div>`;
  const d=ctx.data; if(!d) return h;
  const words=ctx.words.map(i=>W[i]);
  h+=`<div class="row" style="margin-bottom:10px"><button class="chip ${ctx.furi?'on':''}" onclick="ctx.furi=!ctx.furi;render()">ふりがな</button><button class="chip ${ctx.en?'on':''}" onclick="ctx.en=!ctx.en;render()">English</button><button class="chip ${playing?'on':''}" onclick="toggleStory()">${playing?'⏹ Stop':'🔊 Listen'}</button><button class="chip" onclick="stopSpeak();ctx.pending=true;ctx.data=null;render()">↻ New</button></div>
  <div class="card story ${ctx.furi?'':'nofuri'} ${ctx.en?'':'noen'}"><h2>${esc(d.title||title)}</h2>${d.scene?`<div class="hint" style="margin:-6px 0 12px">${esc(d.scene)}</div>`:''}
  ${d.lines.map((l,k)=>`<p style="${ctx.cur===k?'background:var(--soft);border-radius:8px;padding:0 6px;margin-left:-6px':''}">${l.speaker?`<span class="spk">${esc(l.speaker)}</span>`:''}${furi(l.jp,words)}</p><p class="en">${esc(l.en||'')}</p>`).join('')}</div>`;
  if(ctx.mode==='work'){
    h+=`<div class="card"><h2>YOUR TURN — REPLY</h2><p style="margin-top:0;font-size:14px">${esc(d.task||'Write your reply in Japanese.')}</p><textarea id="reply" rows="4" placeholder="日本語で返信してください…">${esc(ctx.reply||'')}</textarea><div style="height:8px"></div><button class="btn primary" onclick="checkReply()"><span class="ic">✍️</span><span>Check my Japanese</span></button>${ctx.fbLoading?'<div class="loading">Checking<span class="dots"></span></div>':''}${ctx.fb?`<div class="fb" style="margin-top:12px">${fmtFb(ctx.fb)}</div>`:''}</div>`;
  }
  h+=`<div class="card"><h2>DID YOU REMEMBER THESE?</h2><ul class="wl">${ctx.words.map(i=>{const w=W[i];const r=ctx.rated[i];return `<li><div><div class="w">${esc(w[0])}</div><div class="r">${esc(w[2])} · ${esc(w[3])}</div></div><div class="row" style="flex-wrap:nowrap">${r===undefined?`<button class="chip" onclick="rate(${i},0)">✗</button><button class="chip" onclick="rate(${i},2)">✓</button>`:`<span class="pill">${r?'✓ got it':'✗ again soon'}</span>`}</div></li>`}).join('')}</ul></div>`;
  return h;
}
function fmtFb(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function rate(i,g){ ctx.rated[i]=g; if(g===0){ const p=S.p[i]; if(p){p.due=Date.now(); p.lapses++; p.iv=0; p.reps=0; save();} else grade(i,0);} else { if(!S.p[i]) grade(i,2); } render(); }
function furi(s,words){
  // format: 漢字{かんじ}
  let h=esc(s).replace(/([一-鿿々ヶ]+)\{([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>').replace(/\{[^}]*\}/g,'');
  return h.replace(/\[\[(.+?)\]\]/g,'<mark>$1</mark>');
}
async function runStory(){
  const words=todaysWords(); ctx.words=words; ctx.rated={}; ctx.loading=true; ctx.furi=true; ctx.en=false; render();
  const list=words.map(i=>`${W[i][0]}（${W[i][2]}）= ${W[i][3]}`).join('\n');
  const work = ctx.mode==='work';
  const scene = SCENES[Math.floor(Math.random()*SCENES.length)];
  const prompt = `You write Japanese reading practice for an Indian software engineer (Bridge SE) living in Yokohama, studying for JLPT N2.
${work?`Write a realistic workplace scene: ${scene}. The learner (ヴィッキー, a Bridge SE at a small software company) talks with a Japanese client or colleague. Use natural business Japanese with appropriate keigo. 8-12 lines of dialogue, each with a speaker name. End at a point where ヴィッキー must reply, and give a one-sentence English "task" describing what he should reply.`:`Write a short, engaging everyday story set in Japan (Yokohama life, family, trains, shops, neighbours, school events — vary it). 6-9 sentences/lines, no speaker names needed (speaker may be empty string).`}
Use ALL of these target words naturally (inflect as needed):
${list}
Keep other vocabulary around JLPT N3-N2.
Formatting rules for "jp":
- After EVERY kanji word add its reading in curly braces right after it, e.g. 会議{かいぎ}を延期{えんき}する. Only kanji get braces.
- Wrap each target word (including its braces) in double square brackets, e.g. [[延期{えんき}]].
- "kana" = the same line entirely in hiragana (for text-to-speech).
- "en" = natural English translation.
Return only JSON: {"title": string (Japanese, short), "scene": string (one English line), "lines":[{"speaker":string,"jp":string,"kana":string,"en":string}]${work?',"task":string':''}}`;
  try{
    const r = await sampleFn.json(prompt,{modelTier:'default'});
    if(!r||!Array.isArray(r.lines)) throw new Error('bad');
    ctx.data=r; ctx.loading=false;
  }catch(e){ ctx.loading=false; ctx.tries=(ctx.tries||0)+1;
    const code=e&&e.code||'error', msg=e&&e.message||String(e);
    ctx.error = code==='rate_limited'?'Too many requests — try again in a minute.'
      : code==='not_granted'?`Claude access is blocked in this view (attempt ${ctx.tries}). If you're in the Claude phone app, open this page in a web browser at claude.ai (phone or PC) — the permission prompt appears there. Detail: ${msg}`
      : `Could not write the story this time (attempt ${ctx.tries}). Detail: ${code} — ${msg}`; }
  render();
}
async function checkReply(){
  const t=document.getElementById('reply').value.trim(); if(!t) return; ctx.reply=t; ctx.fbLoading=true; ctx.fb=null; render();
  const conv=ctx.data.lines.map(l=>`${l.speaker}: ${l.jp.replace(/\{[^}]*\}/g,'').replace(/\[\[|\]\]/g,'')}`).join('\n');
  try{
    const r=await sampleFn(`You are a friendly business-Japanese coach for an Indian Bridge SE in Japan (JLPT N2 level).
Conversation:
${conv}
Task: ${ctx.data.task||''}
His reply: ${t}
Give feedback in English, short and practical:
**Score:** x/10
**What works:** one line
**Fixes:** bullet list of grammar / keigo / word-choice corrections (quote his phrase → better phrase)
**Natural version:** the full corrected reply in Japanese (business-appropriate politeness)
**Tip:** one keigo tip to remember.`,{modelTier:'default',cache:false});
    ctx.fb=r.text;
  }catch(e){ ctx.fb='Could not check right now — try again.'; }
  ctx.fbLoading=false; render();
}

// kanji map
function kanjiIndex(){
  if(window._KI) return window._KI;
  const m=new Map();
  W.forEach((w,i)=>{ for(const c of new Set([...w[1]].filter(isK))){ if(!m.has(c)) m.set(c,[]); m.get(c).push(i);} });
  return window._KI=m;
}
function kanji(){
  const KI=kanjiIndex(); const f=ctx.f||'n2';
  let list=[...KI.entries()];
  if(f==='n2') list=list.filter(([c,ws])=>ws.some(i=>W[i][5]));
  else if(f!=='all') list=list.filter(([c,ws])=>ws.some(i=>W[i][4]===f));
  const lvl=ws=>{ const s=ws.map(strength); const avg=s.reduce((a,b)=>a+b,0)/s.length; return s.every(x=>x===0)?0: avg>=2.5?3: avg>=1.5?2:1; };
  const done=list.filter(([c,ws])=>lvl(ws)===3).length;
  let h=`<button class="back" onclick="${ctx.from==='study'?'restoreStudy()':"go('home')"}">← ${ctx.from==='study'?'Back to study':'Home'}</button>`;
  if(ctx.sel){ const c=ctx.sel; const ws=(KI.get(c)||[]);
    h+=`<div class="card"><div class="row" style="gap:14px"><div class="big" style="font-size:64px">${c}</div><div><div style="font-size:14px;color:var(--muted)">${ws.length} word${ws.length>1?'s':''} in your list use this kanji</div><div style="font-size:13px;margin-top:4px">${ws.filter(i=>strength(i)>=2).length} solid · ${ws.filter(i=>strength(i)===1).length} learning · ${ws.filter(i=>strength(i)===0).length} not started</div></div></div>
    <ul class="wl" style="margin-top:10px">${ws.map(i=>{const w=W[i];return `<li><div><div class="w">${esc(w[1])}</div><div class="r">${esc(w[2])}</div></div><div class="m">${esc(w[3])}<br><span class="tag">${w[4]||'—'}</span><span class="tag">${['new','learning','good','solid'][strength(i)]}</span></div></li>`}).join('')}</ul>
    <div style="height:10px"></div><button class="btn" onclick="studyKanji('${c}')"><span class="ic">🃏</span><span>Study these words now</span></button></div>`;
  }
  h+=`<div class="card"><h2>KANJI MAP · ${done}/${list.length} solid</h2>
  <div class="row">${[['n2','N2 core'],['N5','N5'],['N4','N4'],['N3','N3'],['N2','N2'],['all','All']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" onclick="ctx.f='${k}';ctx.sel=null;render()">${l}</button>`).join('')}</div>
  <div class="legend"><span style="--sw:var(--card);">not started</span><span style="--sw:#f3e1c7">learning</span><span style="--sw:#cfe6d6">good</span><span style="--sw:#5c9e7c">solid</span></div>
  <div class="kgrid">${list.map(([c,ws])=>`<div class="k l${lvl(ws)}" onclick="ctx.sel='${c}';render();window.scrollTo(0,0)">${c}</div>`).join('')}</div></div>`;
  return h;
}
function restoreStudy(){ const s=ctx.save; view='study'; ctx=s; render(); }
function studyKanji(c){ const ws=kanjiIndex().get(c)||[]; const q=ws.filter(i=>!S.known[i]); if(!q.length){toast('All known already');return;} go('study',{q,k:0,show:0,newSet:new Set(),again:[]}); }

// browse
function browse(){
  const q=(ctx.q||'').trim().toLowerCase(); const f=ctx.f||'all';
  let ids=[]; for(let i=0;i<W.length&&ids.length<200;i++){ const w=W[i];
    if(f==='known'&&!S.known[i]) continue; if(f==='learning'&&!S.p[i]) continue; if(['N5','N4','N3','N2','N1'].includes(f)&&w[4]!==f) continue; if(f==='core'&&!w[5]) continue;
    if(q && !(w[0].includes(q)||w[1].includes(q)||w[2].includes(q)||w[3].toLowerCase().includes(q))) continue; ids.push(i); }
  return `<button class="back" onclick="go('home')">← Home</button><div class="card"><input type="search" placeholder="Search kanji, kana or English…" value="${esc(ctx.q||'')}" oninput="ctx.q=this.value;clearTimeout(window._bt);window._bt=setTimeout(()=>{render();const e=document.querySelector('input[type=search]');e.focus();e.setSelectionRange(e.value.length,e.value.length)},250)">
  <div class="row" style="margin-top:10px">${[['all','All'],['core','N2 core'],['N5','N5'],['N4','N4'],['N3','N3'],['N2','N2'],['N1','N1'],['learning','Learning'],['known','Known']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" onclick="ctx.f='${k}';render()">${l}</button>`).join('')}</div>
  <ul class="wl" style="margin-top:8px">${ids.map(i=>{const w=W[i];return `<li><div><div class="w">${esc(w[0])}${w[0]!==w[1]?` <span class="tag">${esc(w[1])}</span>`:''}</div><div class="r">${esc(w[2])}</div></div><div class="m">${esc(w[3])}<br><span class="tag">${w[4]||'—'}</span>${S.known[i]?`<button class="chip" style="margin-left:4px;padding:2px 8px" onclick="delete S.known[${i}];save();render()">unmark known</button>`:`<span class="tag">${['new','learning','good','solid'][strength(i)]}</span>`}</div></li>`}).join('')}</ul>
  ${ids.length===200?'<div class="hint">Showing first 200 — search to narrow down.</div>':''}</div>`;
}
function settings(){
  const s=S.settings;
  return `<button class="back" onclick="go('home')">← Home</button><div class="card"><h2>SETTINGS</h2>
  <label class="set">New words per day <select onchange="S.settings.newPerDay=+this.value;save()">${[5,10,15,20,30].map(n=>`<option ${s.newPerDay===n?'selected':''}>${n}</option>`).join('')}</select></label>
  <label class="set">Card direction <select onchange="S.settings.dir=this.value;save()"><option value="jp" ${s.dir==='jp'?'selected':''}>Japanese → meaning</option><option value="en" ${s.dir==='en'?'selected':''}>Meaning → Japanese</option><option value="mix" ${s.dir==='mix'?'selected':''}>Mixed</option></select></label>
  <label class="set">New word order <select onchange="S.settings.focus=this.value;save()"><option value="n2first" ${s.focus==='n2first'?'selected':''}>N2 core list first</option><option value="easyfirst" ${s.focus==='easyfirst'?'selected':''}>Easy → hard (N5 first)</option><option value="list" ${s.focus==='list'?'selected':''}>File order</option></select></label>
  <p class="hint">Progress ${db?'is saved to your account and syncs across devices.':'is saved in this browser only (open on claude.ai while signed in to sync).'}</p>
  <div class="row" style="margin:6px 0 14px"><button class="chip" onclick="exportProg()">⬇ Back up progress</button><button class="chip" onclick="ctx.imp=!ctx.imp;render()">⬆ Restore progress</button></div>
  ${ctx.exp?`<p class="hint" style="margin:0 0 4px">${esc(ctx.exp)}</p>`:''}
  ${ctx.imp?`<textarea id="impbox" rows="4" placeholder="Paste your backup text here"></textarea><div style="height:6px"></div><button class="chip" onclick="importProg()">Restore</button><div style="height:14px"></div>`:''}
  <button class="chip" onclick="if(ctx.sure){S.p={};S.known={};S.log={};S.introduced={};S.streak={last:0,n:0};save();toast('Progress reset');go('home')}else{ctx.sure=1;render()}">${ctx.sure?'Tap again to confirm reset':'Reset all progress'}</button></div>`;
}
function exportProg(){
  const txt=JSON.stringify(S); let done=[];
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download='kotoba-path-backup.json'; document.body.appendChild(a); a.click(); a.remove(); done.push('file downloaded'); }catch(e){}
  try{ navigator.clipboard.writeText(txt).then(()=>{ctx.exp='Copied to clipboard'+(done.length?' and '+done[0]:'')+'. Paste it into Restore on your other device.';render();},()=>{ctx.exp=done.length?'Backup file downloaded.':'Could not copy — try another browser.';render();}); }catch(e){}
}
function importProg(){
  try{ const o=JSON.parse(document.getElementById('impbox').value); if(!o||!o.p) throw 0; S=Object.assign(S,o); save(); ctx.imp=false; toast('Progress restored'); go('home'); }
  catch(e){ toast('That backup text is not valid'); }
}
loadLocal(); render(); initCaps();
</script>
</body>
</html>
